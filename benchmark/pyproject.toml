[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pan-finder-benchmark"
version = "0.0.0"
description = "Benchmark component for Pan Finder"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.11.7",
  "python-dotenv==1.0.0",
  "psycopg[binary]==3.2.9",
  "psycopg-pool==3.2.6",
  "sentence-transformers==4.1.0",
  "openai==1.93.0",
  "pandas==2.2.3",
  "matplotlib==3.10.1",
  "seaborn",
  "debugpy==1.8.9",
  "ruff",
]