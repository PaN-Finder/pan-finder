apiVersion: v1
kind: ConfigMap
metadata:
  name: pgvector-config
  namespace: pan-finder
  labels:
    app.kubernetes.io/name: pgvector
    app.kubernetes.io/component: database
data:
  POSTGRES_DB: "pan-finder"
  POSTGRES_USER: "usr"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
  namespace: pan-finder
  labels:
    app.kubernetes.io/name: pan-finder-server
    app.kubernetes.io/component: api
data:
  API_HOST: "0.0.0.0"
  API_PORT: "8080"
  ALLOWED_ORIGINS: "*"
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  AZURE_OPENAI_MODEL_NAME: "gpt-4.1-mini"
  EMBEDDING_MODEL_PATH: "/app/models/all-MiniLM-L12-v2"
