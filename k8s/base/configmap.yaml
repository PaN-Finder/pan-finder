apiVersion: v1
kind: ConfigMap
metadata:
  name: pgvector-config
  labels:
    app.kubernetes.io/name: pgvector
    app.kubernetes.io/component: database
data:
  POSTGRES_DB: "pan-finder"
  POSTGRES_USER: "usr"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
  labels:
    app.kubernetes.io/name: pan-finder-server
    app.kubernetes.io/component: api
data:
  API_HOST: "0.0.0.0"
  API_PORT: "8080"
  ALLOWED_ORIGINS: "*"
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  AZURE_OPENAI_MODEL_NAME: "gpt-4.1-mini"
  AZURE_OPENAI_EXPLANATION_MODEL_NAME: "gpt-4.1"
  EMBEDDING_MODEL_PATH: "/app/models/all-MiniLM-L12-v2"
  DB_POOL_MIN_SIZE: "1"
  DB_POOL_MAX_SIZE: "20"
  DB_CONNECTION_TIMEOUT: "30"
  DB_MAX_IDLE: "300"
  DB_MAX_LIFETIME: "3600"
