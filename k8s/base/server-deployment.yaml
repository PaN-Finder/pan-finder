apiVersion: apps/v1
kind: Deployment
metadata:
  name: pan-finder-server
  labels:
    app.kubernetes.io/name: pan-finder-server
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: pan-finder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pan-finder-server
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pan-finder-server
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: pan-finder
    spec:
      imagePullSecrets:
      - name: ess-gitlab-registry-credentials
      initContainers:
      - name: wait-for-db
        image: pgvector/pgvector:0.8.0-pg17
        command:
        - sh
        - -c
        - |
          until pg_isready -h pgvector-service -p 5432 -d pan-finder -U usr; do
            echo "Waiting for database to be ready..."
            sleep 5
          done
          echo "Database is ready!"
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: pgvector-secret
              key: POSTGRES_PASSWORD
      containers:
      - name: server
        image: registry.esss.lu.se/swap/pan-finder:server
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: server-config
        - secretRef:
            name: server-secret
        env:
        - name: PYTHONPATH
          value: /app
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
