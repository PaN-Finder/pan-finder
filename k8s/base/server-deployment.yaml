apiVersion: apps/v1
kind: Deployment
metadata:
  name: pan-finder-server
  labels:
    app.kubernetes.io/name: pan-finder-server
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: pan-finder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pan-finder-server
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pan-finder-server
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: pan-finder
    spec:
      containers:
      - name: server
        image: ghcr.io/pan-finder/pan-finder-server
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: server-config
        - secretRef:
            name: server-secret
        env:
        - name: PYTHONPATH
          value: /app
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
