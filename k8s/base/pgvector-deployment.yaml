apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
  labels:
    app.kubernetes.io/name: pgvector
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: pan-finder
spec:
  replicas: 1
  strategy:
    type: Recreate  # Important for database with persistent storage
  selector:
    matchLabels:
      app.kubernetes.io/name: pgvector
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgvector
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: pan-finder
    spec:
      containers:
      - name: pgvector
        image: pgvector/pgvector:0.8.0-pg17
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: pgvector-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: pgvector-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pgvector-secret
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        args:
          - postgres
          - -c logging_collector=on
          - -c log_destination=stderr
          - -c log_min_duration_statement=1000
          - -c log_statement=mod
          - -c log_duration=on
          - '-c log_line_prefix=%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
          - -c shared_buffers=3GB
          - -c work_mem=256MB
          - -c maintenance_work_mem=1GB
          - -c effective_cache_size=9GB
        volumeMounts:
        - name: pgvector-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -d
            - pan-finder
            - -U
            - usr
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -d
            - pan-finder
            - -U
            - usr
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "12Gi"
            cpu: "5000m"
      volumes:
      - name: pgvector-data
        persistentVolumeClaim:
          claimName: pgvector-data
