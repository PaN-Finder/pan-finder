apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
  labels:
    app.kubernetes.io/name: pgvector
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: pan-finder
spec:
  replicas: 1
  strategy:
    type: Recreate  # Important for database with persistent storage
  selector:
    matchLabels:
      app.kubernetes.io/name: pgvector
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgvector
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: pan-finder
    spec:
      containers:
      - name: pgvector
        image: pgvector/pgvector:0.8.0-pg17
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: pgvector-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: pgvector-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pgvector-secret
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        # Slow query logging configuration
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
        - name: POSTGRES_HOST_AUTH_METHOD
          value: scram-sha-256
        # PostgreSQL configuration for performance monitoring
        - name: POSTGRES_CONFIG_LOG_MIN_DURATION_STATEMENT
          value: "1000"  # Log queries taking longer than 1 second
        - name: POSTGRES_CONFIG_LOG_STATEMENT
          value: "mod"   # Log DDL and data modification statements
        - name: POSTGRES_CONFIG_LOG_DURATION
          value: "on"    # Log duration of completed statements
        - name: POSTGRES_CONFIG_LOG_LINE_PREFIX
          value: "%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "
        - name: POSTGRES_CONFIG_SHARED_BUFFERS
          value: "3GB"   # ~25% of available memory (12GB limit)
        - name: POSTGRES_CONFIG_WORK_MEM
          value: "256MB" # Memory for sorting/hashing operations
        - name: POSTGRES_CONFIG_MAINTENANCE_WORK_MEM
          value: "1GB"   # Memory for maintenance operations
        - name: POSTGRES_CONFIG_EFFECTIVE_CACHE_SIZE
          value: "9GB"   # ~75% of available memory for query planner
        volumeMounts:
        - name: pgvector-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -d
            - pan-finder
            - -U
            - usr
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -d
            - pan-finder
            - -U
            - usr
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "12Gi"
            cpu: "5000m"
      volumes:
      - name: pgvector-data
        persistentVolumeClaim:
          claimName: pgvector-data
