apiVersion: v1
kind: Service
metadata:
  name: pgvector-service
  labels:
    app.kubernetes.io/name: pgvector
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: pan-finder
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app.kubernetes.io/name: pgvector
    app.kubernetes.io/component: database
---
apiVersion: v1
kind: Service
metadata:
  name: pan-finder-server-service
  labels:
    app.kubernetes.io/name: pan-finder-server
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: pan-finder
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
    nodePort: 30081
  selector:
    app.kubernetes.io/name: pan-finder-server
    app.kubernetes.io/component: api
