apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pan-finder-ingress  
spec:
  ingressClassName: traefik-proxy-prod
  rules:
  - host: pan-finder.ess.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pan-finder-server-service
            port:
              name: http
