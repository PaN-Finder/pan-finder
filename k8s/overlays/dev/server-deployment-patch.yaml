apiVersion: apps/v1
kind: Deployment
metadata:
  name: pan-finder-server
  namespace: pan-finder
spec:
  replicas: 1  # Single replica for dev
  template:
    spec:
      containers:
      - name: server
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        env:
        - name: LOG_LEVEL
          value: "debug"
