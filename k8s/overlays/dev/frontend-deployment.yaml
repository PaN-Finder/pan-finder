apiVersion: apps/v1
kind: Deployment
metadata:
  name: pan-finder-frontend
  namespace: pan-finder
  labels:
    app.kubernetes.io/name: pan-finder-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: pan-finder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pan-finder-frontend
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pan-finder-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: pan-finder
    spec:
      containers:
      - name: frontend
        image: registry.esss.lu.se/swap/pan-finder:frontend
        ports:
        - containerPort: 80
          name: http
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
