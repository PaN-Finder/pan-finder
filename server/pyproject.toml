[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pan-finder-server"
version = "0.0.0"
description = "Server component for Pan Finder"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.14",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "python-dotenv==1.0.0",
  "psycopg[binary]==3.2.9",
  "psycopg-pool==3.2.6",
  "sentence-transformers==4.1.0",
  "openai==1.93.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-dotenv",
  "pytest-snapshot",
  "debugpy==1.8.9",
  "ruff",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
