name: Release server image

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push server image
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: | 
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          images=$(docker image ls -aq)
          if [ -n "$images" ]; then
            docker rmi -f $images || true
          fi
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name
        id: image
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/pan-finder-server"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Determine version string
        id: version
        run: |
          version="${{ steps.meta.outputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME:-dev}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore cached embedding model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/all-MiniLM-L12-v2
          key: embedding-model-all-minilm-l12-v2

      - name: Download embedding model
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install
          mkdir -p models
          if [ ! -d models/all-MiniLM-L12-v2 ]; then
            git clone https://huggingface.co/sentence-transformers/all-MiniLM-L12-v2 models/all-MiniLM-L12-v2
          fi

      - name: Save embedding model to cache (if updated)
        if: steps.cache-model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: models/all-MiniLM-L12-v2
          key: embedding-model-all-minilm-l12-v2

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/docker/Dockerfile.prod
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            SERVER_VERSION=${{ steps.version.outputs.version }}
