name: Build development server image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-dev:
    name: Build and push development server image
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name
        id: image
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/pan-finder-server"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Determine version string
        id: version
        run: |
          short_sha=$(git rev-parse --short HEAD)
          echo "version=dev-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Restore cached embedding model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/all-MiniLM-L12-v2
          key: embedding-model-all-minilm-l12-v2

      - name: Download embedding model
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install
          mkdir -p models
          if [ ! -d models/all-MiniLM-L12-v2 ]; then
            git clone https://huggingface.co/sentence-transformers/all-MiniLM-L12-v2 models/all-MiniLM-L12-v2
            rm -rf models/all-MiniLM-L12-v2/.git
            rm -rf models/all-MiniLM-L12-v2/onnx
            rm -rf models/all-MiniLM-L12-v2/openvino
          fi

      - name: Save embedding model to cache (if updated)
        if: steps.cache-model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: models/all-MiniLM-L12-v2
          key: embedding-model-all-minilm-l12-v2

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/docker/Dockerfile.prod
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            SERVER_VERSION=${{ steps.version.outputs.version }}
